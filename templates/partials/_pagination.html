{% if page_obj.has_other_pages %}
<div class="pagination">
  {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">&laquo; Prev</a>{% endif %}
  {% for n in page_obj.paginator.page_range %}
    {% if n == page_obj.number %}<span class="current">{{ n }}</span>
    {% else %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ n }}">{{ n }}</a>{% endif %}
  {% endfor %}
  {% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Next &raquo;</a>{% endif %}
</div>
{% endif %}
